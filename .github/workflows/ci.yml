name: Sagnac Reference CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff
      - name: Ruff (all checks must pass)
        run: ruff check src/ tests/ tools/
      - name: Negative controls (all corruptions must be detected)
        run: python tools/run_negative_controls.py
      - name: Verdict evaluator (SAG-S1..S10)
        run: python tools/evaluate_reference.py
      - name: Convergence campaign (frozen tolerances)
        run: python tools/run_convergence_campaign.py
      - name: Phase geometry
        run: python tools/run_phase_geometry.py
      - name: Pytest
        run: python -m pytest -q
